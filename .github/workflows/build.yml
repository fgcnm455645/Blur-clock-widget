name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find project (zip or plain files)
        run: |
          set -e
          rm -rf _proj && mkdir _proj
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            echo "Using zip: $ZIP"
            unzip -q "$ZIP" -d _proj
          else
            echo "No zip found, using repo files"
            shopt -s dotglob
            for f in *; do
              case "$f" in _proj|.git|.github) ;; *) cp -r "$f" _proj/ ;; esac
            done
          fi
          S=$(find _proj -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle not found"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: _proj/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
